name: build_and_test
on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]

jobs:
    test:
        name: PHP ${{ matrix.php-version }} Test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version: [ '8.3', '8.4', '8.5' ]
            fail-fast: false  # Continue with other versions even if one fails

        env:
            DB_HOST: 127.0.0.1
            DB_USERNAME: app
            DB_PASSWORD: app
            DB_DATABASE: testing
            ENVIRONMENT: TESTING
            PRIVATE_KEY: testing

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: testing
                    MYSQL_USER: app
                    MYSQL_PASSWORD: app
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-start-period=90s --health-retries=10

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup PHP ${{ matrix.php-version }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: mysqli, pdo_mysql

            -   name: Cache Composer dependencies
                uses: actions/cache@v4
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

            -   name: Cache Yarn dependencies
                uses: actions/cache@v4
                with:
                    path: node_modules
                    key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-yarn-

            -   name: Install Composer dependencies
                run: COMPOSER_ROOT_VERSION=dev-develop composer install --no-interaction --prefer-dist

            -   name: Install Yarn dependencies
                run: yarn install

            -   name: Run tests
                run: composer test

            -   name: Build assets
                run: yarn build
